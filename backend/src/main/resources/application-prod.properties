# Production Profile
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/worldcupdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:worldcup}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:worldcup123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# JPA/Hibernate Configuration
# Disable autoCommit to allow Spring to manage transactions properly
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# HikariCP Connection Pool Configuration
# Ensure autoCommit is disabled at the connection pool level
spring.datasource.hikari.auto-commit=false

# Pool size. Small by default - this app is low traffic and every idle
# connection costs memory on both sides. Raise via env for a busy tournament.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# Football API Configuration (can be overridden by environment variables)
# IMPORTANT: Set FOOTBALL_API_KEY as environment variable in production
football.api.enabled=${FOOTBALL_API_ENABLED:true}
football.api.key=${FOOTBALL_API_KEY:}
football.api.base-url=${FOOTBALL_API_BASE_URL:https://api.football-data.org/v4}
football.api.competition-id=${FOOTBALL_API_COMPETITION_ID:2000}

# Scheduler Intervals (in milliseconds)
# Low-power/viloläge settings: Reduced frequency for external API calls
# Default values are for normal operation, can be overridden via environment variables
# For viloläge, use: 21600000 (6h), 300000 (5min), 1800000 (30min)
football.api.sync.fixtures.interval=${FOOTBALL_API_SYNC_FIXTURES_INTERVAL:21600000}
football.api.sync.live.interval=${FOOTBALL_API_SYNC_LIVE_INTERVAL:300000}
football.api.sync.finished.interval=${FOOTBALL_API_SYNC_FINISHED_INTERVAL:1800000}
match.status.update.interval=${MATCH_STATUS_UPDATE_INTERVAL:120000}

# Background schedulers. Set both to false between tournaments (viloläge) so an
# idle deployment does no periodic database work at all. See VILOLAGE_SETUP.md.
match.status.scheduler.enabled=${MATCH_STATUS_SCHEDULER_ENABLED:true}
league.achievement.scheduler.enabled=${LEAGUE_ACHIEVEMENT_SCHEDULER_ENABLED:true}

# Season cut-off for the global leaderboard (ISO date-time, e.g.
# 2026-09-01T00:00). Empty = all-time. Predictions before the cut-off stay in
# the database and on profiles; they just stop counting on the global board.
app.season.start=${APP_SEASON_START:}

# Logging. Production only needs our own INFO lines; the framework's scheduling
# DEBUG output from application.properties would otherwise log on every tick.
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.worldcup=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.scheduling=${LOG_LEVEL_SCHEDULING:WARN}

